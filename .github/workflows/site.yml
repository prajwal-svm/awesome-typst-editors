name: Site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  discussions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - name: Run the tests
        run: |
          set -euo pipefail
          bash tests/run.sh
      - name: Create missing discussions
        run: |
          set -euo pipefail
          scripts/ensure-discussions.sh
      - name: Fetch stars and hearts
        run: |
          set -euo pipefail
          mkdir -p build
          scripts/fetch-data.sh > build/generated.json.tmp
          mv build/generated.json.tmp data/generated.json
      - name: Build the site
        run: |
          set -euo pipefail
          typst compile site/main.typ _site --format bundle --features bundle,html --root . \
            --input generated=/data/generated.json --input today="$(date -u +%F)"
      - name: Commit README if changed
        run: |
          set -euo pipefail
          mv _site/README.md README.md
          if [ -z "$(git status --porcelain -- README.md)" ]; then
            echo "README unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: regenerate README"
            git pull --rebase
            git push
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
